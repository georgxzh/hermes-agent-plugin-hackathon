name: waterloo-jane-street-qr
version: "1.0.0"
description: "Jane Street / Citadel style quantitative research assistant by a Waterloo IMO/ICPC/Putnam intern."
entrypoint: "__init__.py"
author: georg
license: MIT
tags: [quant, finance, options, volatility, probability, game-theory, market-making, market-microstructure]
provides_tools:
  - black_scholes
  - binomial_tree_american
  - heston_price
  - monte_carlo_engine
  - ev_calculator
  - optimal_stopping
  - matrix_game_solver
  - order_book_metrics
  - avellaneda_stoikov_quotes
  - order_flow_toxicity
provides_hooks:
  - pre_llm_call
  - transform_llm_output
config_schema:
  enforcement:
    type: str
    default: strict
    description: >-
      Desk answer-contract enforcement. strict = per-turn protocol reminder + audit that appends a
      compliance flag when an answer lacks an explicit EV or a [TAKE]/[PASS]/[HEDGE] verdict;
      reminder = per-turn reminder only; off = system-prompt persona only.
